name: Import catalog

on:
  schedule:
    # Off the hour: GitHub delays and drops scheduled runs most at the top of the hour.
    - cron: "42 2 * * *"
  workflow_dispatch:

# Each job grants only the permissions it needs.
permissions: {}

# A manual run waits for the scheduled one, so two runs never push the same branch.
concurrency:
  group: ${{ github.workflow }}

jobs:
  import:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # Every commit but no file history: the script dates each device file of this package's own by the commit that last changed it, which a shallow clone would make its one commit.
          fetch-depth: 0
          filter: blob:none
      - uses: pnpm/setup@v3
      - id: import
        run: |
          # Commits and trees but no file history: the script walks the devices folder's log, and reads only today's files.
          git clone --quiet --filter=blob:none https://github.com/make-all/tuya-local.git "$RUNNER_TEMP/tuya-local"
          pnpm --filter @open-tuya/devices import-catalog "$RUNNER_TEMP/tuya-local"
          echo "commit=$(git -C "$RUNNER_TEMP/tuya-local" rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - env:
          COMMIT: ${{ steps.import.outputs.commit }}
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            cat > .changeset/devices-tuya-local-import.md <<EOF
          ---
          "@open-tuya/devices": patch
          ---

          Update the catalog to tuya-local's device files at make-all/tuya-local@${COMMIT::7}.
          EOF
          fi
      # Taken after the import, so the script never sees it. DESIGN.md#catalog says why an App's token.
      - id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.PULL_REQUEST_APP_CLIENT_ID }}
          private-key: ${{ secrets.PULL_REQUEST_APP_PRIVATE_KEY }}
      - uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: import-catalog
          commit-message: |
            Import the catalog from tuya-local ${{ steps.import.outputs.commit }}

            https://github.com/make-all/tuya-local/tree/${{ steps.import.outputs.commit }}/custom_components/tuya_local/devices
          title: Import the catalog from tuya-local
          # Notifies the maintainer, who merges the pull request.
          reviewers: cheziyi
          body: |
            `scripts/importTuyaLocal.ts` converted tuya-local's device files at [`make-all/tuya-local@${{ steps.import.outputs.commit }}`](https://github.com/make-all/tuya-local/tree/${{ steps.import.outputs.commit }}/custom_components/tuya_local/devices) into `packages/devices/src/catalog/` and `UNSUPPORTED.md`.

            - Raise the changeset to the bump [AGENTS.md](https://github.com/${{ github.repository }}/blob/main/AGENTS.md#version-each-package-with-semver) gives if the diff removes or renames a catalog entry or a control: it bumps `@open-tuya/devices` by a patch.
            - Fix a failing check on `main`, in the script or `CONTROL_NAMES`, not on this branch: the next run resets the branch to `main` plus a fresh import.
