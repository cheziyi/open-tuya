name: CI

on:
  pull_request:
  push:
    branches: [main]
  # import-catalog.yml starts it on the pull request it opens.
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Installs the pnpm in `packageManager` and the Node in `.nvmrc`, then runs `pnpm install`.
      - uses: pnpm/setup@v3
      - run: pnpm check

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # Every Node release line that `engines` in package.json accepts and Node still maintains.
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          runtime: node@${{ matrix.node }}
      - run: pnpm test
